<html lang="fr">

<style>
/* VOICE: énergique et net, une appli qu'on a envie d'ouvrir chaque matin.
   IDEA: un plan de métro — chaque matière est une ligne colorée, chaque jour validé une station.
   PICTURE: la ligne de la semaine (7 stations) avec la flamme de la série, l'anneau du minuteur.
   COLOUR and TYPE: blanc franc / nuit #0e1116, lignes rouge, bleu, ambre, vert, cyan ; Figtree 800 + Figtree.
   LAYOUT: colonne d'appli mobile, barre d'onglets en bas, 2 colonnes au-delà de 900px. */
:root{color-scheme:light dark;
--bg:light-dark(#ffffff,#0e1116);--ink:light-dark(#101418,#eef1f5);--mute:light-dark(#5b6470,#9aa4b2);
--card:light-dark(#f3f5f8,#171b23);--card2:light-dark(#e8ecf2,#212733);--line:light-dark(#dfe4ea,#2a313d);
--red:#e6261f;--blue:#0a5cff;--amber:#ffb400;--green:#00a05a;--cyan:#00a3c4;--fire:#ff6a00}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Figtree,system-ui,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.app{max-width:1080px;margin:0 auto;padding:18px max(4vw,16px) 110px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
h1{font-size:clamp(28px,6vw,40px);line-height:1.05;font-weight:800;margin:0;letter-spacing:-.02em;text-wrap:balance}
h2{font-size:20px;font-weight:800;margin:0 0 12px;line-height:1.2}
h3{font-size:16px;margin:0;font-weight:700}
.sub{color:var(--mute);font-size:15px;margin:4px 0 0}
.sync{font-size:13px;color:var(--mute);display:flex;align-items:center;gap:6px;white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--amber)}
.sync.ok i{background:var(--green)}
.sync span{display:inline}@media(max-width:600px){.sync span{display:none}.day{font-size:14px}.day small{font-size:12px}}
.grid{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
@media(min-width:900px){.grid.two{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr)}.span{grid-column:1/-1}}
.card{background:var(--card);border-radius:22px;padding:18px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{justify-content:space-between}
.btn{border:0;border-radius:14px;min-height:44px;padding:0 16px;font-weight:700;background:var(--card2)}
.btn.pri{background:var(--ink);color:var(--bg)}
.btn.fire{background:var(--fire);color:#fff}
.btn.ghost{background:transparent;border:1.5px solid var(--line)}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px;border-radius:11px}
.icon{width:44px;height:44px;border:0;border-radius:14px;background:var(--card2);display:grid;place-items:center}
.muted{color:var(--mute)}.small{font-size:14px}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--card2);white-space:nowrap}
.empty{color:var(--mute);font-size:15px;padding:8px 0}
/* hero série */
.hero{background:var(--ink);color:var(--bg);border-radius:26px;padding:22px;position:relative;overflow:hidden}
.hero .big{font-size:clamp(56px,14vw,84px);font-weight:800;line-height:.95;letter-spacing:-.04em}
.hero .muted{color:color-mix(in srgb,var(--bg) 62%,transparent)}
.flame{width:64px;height:76px;flex:none}
.metro{position:relative;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));margin:22px 0 6px}
.metro:before{content:"";position:absolute;left:7%;right:7%;top:15px;height:6px;border-radius:6px;background:color-mix(in srgb,var(--bg) 22%,transparent)}
.metro .fill{position:absolute;left:7%;top:15px;height:6px;border-radius:6px;background:var(--fire)}
.st{position:relative;display:grid;justify-items:center;gap:6px;font-size:13px;font-weight:700}
.st b{width:36px;height:36px;border-radius:50%;border:5px solid color-mix(in srgb,var(--bg) 30%,transparent);background:var(--ink);display:grid;place-items:center;font-size:13px}
.st.on b{border-color:var(--fire);background:var(--fire)}
.st.today b{box-shadow:0 0 0 4px color-mix(in srgb,var(--fire) 35%,transparent)}
.bar{height:10px;border-radius:10px;background:var(--card2);overflow:hidden}
.hero .bar{background:color-mix(in srgb,var(--bg) 20%,transparent)}
.bar>i{display:block;height:100%;border-radius:10px;background:var(--fire);transition:width .6s}
/* listes */
.list{display:grid;gap:8px}
.item{display:flex;align-items:center;gap:12px;background:var(--bg);border-radius:16px;padding:12px 14px}
.card .item{background:var(--bg)}
.item .grow{flex:1}
.check{width:28px;height:28px;border-radius:9px;border:2px solid var(--line);background:transparent;flex:none;display:grid;place-items:center;padding:0}
.check.on{background:var(--green);border-color:var(--green);color:#fff}
/* emploi du temps */
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-bottom:14px}
.day{min-height:58px;border:0;border-radius:16px;background:var(--card);display:grid;place-items:center;font-weight:800;line-height:1.1;padding:6px 2px}
.day small{font-weight:500;font-size:13px;color:var(--mute)}
.day.on{background:var(--ink);color:var(--bg)}.day.on small{color:inherit;opacity:.7}
.slot{display:grid;grid-template-columns:72px 26px minmax(0,1fr);gap:0 10px;align-items:stretch;border:0;background:transparent;text-align:left;padding:0;width:100%}
.slot .t{font-size:22px;font-weight:800;line-height:1.1;padding-top:12px;white-space:nowrap}
.slot .t small{display:block;font-size:14px;font-weight:500;color:var(--mute)}
.slot .ln{position:relative}
.slot .ln:before{content:"";position:absolute;left:10px;top:0;bottom:0;width:6px;background:var(--c)}
.slot .ln:after{content:"";position:absolute;left:3px;top:16px;width:20px;height:20px;border-radius:50%;background:var(--bg);border:5px solid var(--c)}
.slot .bx{background:var(--card);border-radius:16px;padding:12px 14px;margin:4px 0}
.slot.now .bx{outline:2.5px solid var(--c)}
/* focus */
.ring{position:relative;width:min(280px,72vw);aspect-ratio:1;margin:8px auto}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .in{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .clock{font-size:clamp(46px,12vw,64px);font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:2px solid var(--line);background:transparent;border-radius:99px;min-height:40px;padding:0 14px;font-weight:700;display:inline-flex;align-items:center;gap:8px}
.chip.on{border-color:var(--c,var(--ink));background:color-mix(in srgb,var(--c,var(--ink)) 14%,transparent)}
.hm{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:4px;max-width:520px}
.hm i{aspect-ratio:1;border-radius:4px;background:var(--card2)}
.sbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;font-size:15px}
.sbar .bar{grid-column:1/-1;height:12px}
.cols{display:flex;align-items:flex-end;gap:6px;height:120px}
.cols div{flex:1;display:grid;align-content:end;gap:4px;text-align:center;font-size:12px;color:var(--mute);height:100%}
.cols b{display:block;border-radius:8px 8px 4px 4px;background:var(--green);min-height:3px}
/* plus */
.menu{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr))}
.mi{border:0;text-align:left;background:var(--card);border-radius:20px;padding:16px;min-height:92px;display:grid;gap:4px;align-content:start}
.mi b{font-size:17px}
.kpi{font-size:clamp(34px,8vw,46px);font-weight:800;letter-spacing:-.03em;line-height:1}
/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:5}
nav.tabs div{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));width:100%;max-width:560px}
nav.tabs button{border:0;background:transparent;min-height:54px;display:grid;justify-items:center;gap:2px;font-size:12px;font-weight:700;color:var(--mute);border-radius:14px}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button.on{color:var(--ink)}
nav.tabs button.on svg{color:var(--fire)}
/* feuille */
.sheet{position:fixed;inset:0;z-index:10;display:grid;align-items:end;justify-items:center}
.sheet[hidden]{display:none}
.sheet .bgd{position:absolute;inset:0;background:rgba(5,8,12,.5)}
.sheet form{position:relative;background:var(--bg);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:26px 26px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));display:grid;gap:12px;animation:up .25s ease-out}
@media(min-width:600px){.sheet{align-items:center}.sheet form{border-radius:26px}}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
label.f{display:grid;gap:5px;font-size:14px;font-weight:700;color:var(--mute)}
.f input,.f select,.f textarea{font-size:16px;min-height:46px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);padding:10px 12px;color:var(--ink);font-weight:500}
.f textarea{min-height:84px;resize:vertical}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:700;z-index:20;max-width:90vw}
.back{border:0;background:transparent;font-weight:700;color:var(--mute);min-height:40px;padding:0;margin-bottom:6px}
.note{font-size:13px;color:var(--mute);margin-top:10px}
body.ro [data-add],body.ro [data-val],body.ro [data-unval],body.ro [data-start],body.ro [data-pause],body.ro [data-stop],body.ro [data-rvgo],body.ro [data-rvdone],body.ro [data-rvskip],body.ro [data-rvundo],body.ro [data-defi],body.ro [data-delses],body.ro [data-ok],body.ro [data-ko],body.ro [data-ederr],body.ro [data-edrout],body.ro [data-export],body.ro [data-bklist],body.ro [data-copy],body.ro [data-newkey],body.ro .ro-hide{display:none!important}
body.ro .check,body.ro [data-p3],body.ro [data-rt],body.ro [data-tk],body.ro [data-slot],body.ro [data-edtask],body.ro [data-edsport],body.ro [data-edgrade],body.ro [data-edsub],body.ro [data-sim]{pointer-events:none}
.slot.rev .ln:before{background:repeating-linear-gradient(var(--c) 0 7px,transparent 7px 12px)}
.slot.rev .ln:after{border-style:dotted}
.slot.rev .bx{background:transparent;border:2px dashed color-mix(in srgb,var(--c) 70%,transparent)}
.slot.done{opacity:.5}
.bdg{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,140px),1fr));gap:10px}
.bd{background:var(--bg);border-radius:16px;padding:12px;display:grid;gap:2px;font-size:13px;color:var(--mute);align-content:start}
.bd b{color:var(--ink);font-size:15px;line-height:1.2;margin-top:4px}
.bd svg{width:40px;height:40px;fill:var(--card2);stroke:var(--mute);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.bd.ok svg{fill:var(--fire);stroke:#fff}
input[type=range]{width:100%;min-height:36px}
</style>
</head>
<body>
<div class="app" id="app"></div>
<nav class="tabs"><div id="tabs"></div></nav>
<div class="sheet" id="sheet" hidden><div class="bgd" data-close></div><form id="sf"></form></div>
<script>
{
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,10);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const iso=d=>{d=new Date(d);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const today=()=>iso(new Date());
const addD=(s,n)=>{const d=new Date(s+'T12:00');d.setDate(d.getDate()+n);return iso(d)};
const dow=s=>(new Date(s+'T12:00').getDay()+6)%7;
const wStart=s=>addD(s,-dow(s));
const diff=(a,b)=>Math.round((new Date(b+'T12:00')-new Date(a+'T12:00'))/864e5);
const fm=m=>{m=Math.round(m);return m<60?m+' min':Math.floor(m/60)+' h'+(m%60?' '+String(m%60).padStart(2,'0'):'')};
const DN=['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];
const DL=['lundi','mardi','mercredi','jeudi','vendredi','samedi','dimanche'];
const MO=['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
const fd=s=>{const d=new Date(s+'T12:00');return d.getDate()+' '+MO[d.getMonth()]};
const PAL={'Rouge':'#e6261f','Bleu':'#0a5cff','Ambre':'#ffb400','Vert':'#00a05a','Cyan':'#00a3c4','Rose':'#e5007d','Violet':'#7a3cff','Brun':'#9a5b2e'};

const DEF=()=>({
 subjects:[
  {id:'g',name:'Principes de gestion',short:'Gestion',color:'#e6261f',coef:1,exam:'',goal:4},
  {id:'e',name:"Principes d'économie",short:'Éco',color:'#0a5cff',coef:1,exam:'',goal:4},
  {id:'d',name:'Introduction au droit',short:'Droit',color:'#ffb400',coef:1,exam:'',goal:3},
  {id:'m',name:'Mathématiques 1',short:'Maths',color:'#00a05a',coef:1,exam:'',goal:4},
  {id:'i',name:'Institutions politiques',short:'Institutions',color:'#00a3c4',coef:1,exam:'',goal:2},
  {id:'s',name:'Techniques statistiques',short:'Stats',color:'#e5007d',coef:1,exam:'',goal:2}],
 slots:[
  ['2026-11-16','08:00','10:00','m','CM','Pauliane Amphi 1'],['2026-11-16','10:30','12:00','g','CC GR2','Pauliane S 223'],['2026-11-16','13:00','15:00','i','CM','Pauliane Amphi 1'],
  ['2026-11-17','13:00','15:00','d','CM','Pauliane Amphi 1'],['2026-11-17','15:15','16:45','e','CC GR2','Pauliane PI 219'],
  ['2026-11-18','09:00','10:30','g','TD GR2','Pauliane S 223'],['2026-11-18','12:30','14:00','s','TD GR2','Pauliane S 114'],['2026-11-18','15:00','18:00','g','CM','Pauliane Amphi 1'],
  ['2026-11-20','09:00','12:00','e','CM','Pauliane Amphi 1'],
  ['2026-11-23','08:00','10:00','m','CM','Pauliane Amphi 1'],['2026-11-23','10:30','12:00','g','TD GR2','Pauliane S 224'],['2026-11-23','13:00','15:00','i','CM','Pauliane Amphi 1'],['2026-11-23','15:15','17:15','m','CM','Pauliane Amphi 1'],
  ['2026-11-24','13:00','15:00','d','CM','Pauliane Amphi 1'],
  ['2026-11-25','09:00','10:30','g','TD GR2','Pauliane S 224'],['2026-11-25','10:45','12:15','m','TD GR2','Pauliane S 224'],['2026-11-25','12:30','14:00','s','TD GR2','Pauliane S 224'],['2026-11-25','15:00','18:00','g','CM','Pauliane Amphi 1'],
  ['2026-11-26','11:15','12:45','e','TD GR2','Pauliane PI 219'],['2026-11-26','13:30','15:30','i','CM','Pauliane Amphi 1'],
  ['2026-11-27','13:15','16:15','e','CM','Pauliane Amphi 1']
 ].map(([date,start,end,subj,kind,room])=>({id:uid(),date,start,end,subj,kind,room})),
 sessions:[],val:{},dailyGoal:120,
 sport:[],sportGoal:3,
 tasks:[],grades:[],target:16,errors:[],
 routine:{am:['Lever sans snooze','Grand verre d’eau','Cartes Anki du jour','Planifier les 3 priorités'],pm:['Relire le carnet d’erreurs','Préparer le sac','Écrans coupés 30 min avant','Au lit avant 23 h'],done:{}},
 sleep:[],
 plan:{from:'08:00',to:'21:00',cap:180,we:240,int:'intense',lunch:true},planDone:{},planSkip:{},prio:{},defi:{},sim:{},badges:[],lvl:0,xpErr:0,errDone:0
});
let S=DEF(),T=0;
try{const l=JSON.parse(localStorage.getItem('l1app')||'null');if(l&&l.json){S=Object.assign(DEF(),JSON.parse(l.json));T=l.t||0}}catch(e){}

/* ---------- sauvegarde ---------- */
/* ---------- base de données (Supabase) ---------- */
const CFG={url:'https://gqayquzmmfiwrenwpcir.supabase.co',key:'sb_publishable_W8eTsxwSpTctNOTbukEm2g_9mK7Dj0p'};
const ONLINE=!CFG.url.startsWith('__');
const H={apikey:CFG.key,'Content-Type':'application/json'};
let KEY=null;try{KEY=localStorage.getItem('l1key')}catch(e){}
{const m=location.hash.match(/^#edit-([a-z0-9]{24,})$/i);if(m){KEY=m[1];try{localStorage.setItem('l1key',KEY)}catch(e){}history.replaceState(null,'',location.pathname+location.search)}}
let RO=!KEY||location.hash==='#vue';
if(RO){try{const v=JSON.parse(localStorage.getItem('l1view')||'null');if(v){S=Object.assign(DEF(),v.data);T=v.t}else{S=DEF();T=0}}catch(e){}}
const score=x=>{if(!x)return 0;const k=o=>o?Object.keys(o).length:0;return (x.sessions||[]).length*3+(x.grades||[]).length*3+(x.tasks||[]).length*2+(x.errors||[]).length*2+(x.sport||[]).length*2+(x.sleep||[]).length+k(x.val)*2+k(x.planDone)+k(x.prio)+k(x.defi)+k(x.routine&&x.routine.done)};
let wT=null,writing=false,again=false,synced=false,remoteT=0;const T0=T;
function localBk(x){try{const j=x||JSON.stringify(S);if(score(JSON.parse(j))<1)return;const a=JSON.parse(localStorage.getItem('l1app-bk')||'[]');if(a.length&&a[0].json===j)return;a.unshift({t:Date.now(),json:j});localStorage.setItem('l1app-bk',JSON.stringify(a.slice(0,8)))}catch(e){}}
if(!RO&&score(S)>0)localBk();
let SYNC=RO?'ro':'local';
const SYNCL={ok:'Synchronisé',local:'Hors ligne',ro:'Lecture seule',err:'Erreur de synchro'};
const setSync=k=>{SYNC=k;const e=$('#sync');if(e){e.className='sync'+(k==='ok'||k==='ro'?' ok':'');e.lastChild.textContent=SYNCL[k]}};
async function rpc(fn,body){const r=await fetch(CFG.url+'/rest/v1/rpc/'+fn,{method:'POST',headers:H,body:JSON.stringify(body)});if(!r.ok)throw new Error(await r.text());return r.json()}
async function getRemote(){const r=await fetch(CFG.url+'/rest/v1/etat?id=eq.moi&select=data,t',{headers:H,cache:'no-store'});if(!r.ok)throw new Error('lecture');const a=await r.json();return a[0]||null}
async function push(){if(RO||!synced||!ONLINE)return;if(writing){again=true;return}writing=true;
 try{await rpc('enregistrer',{p_cle:KEY,p_data:S,p_t:T});remoteT=T;setSync('ok')}catch(e){setSync('err')}
 writing=false;if(again){again=false;push()}}
function save(){if(RO)return;T=Date.now();try{localStorage.setItem('l1app',JSON.stringify({json:JSON.stringify(S),t:T}))}catch(e){}
 if(synced){clearTimeout(wT);wT=setTimeout(push,700)}}
async function connect(){
 if(!ONLINE){synced=true;setSync(RO?'ro':'local');return}
 try{
  if(!RO&&!(await rpc('verifier',{p_cle:KEY}))){RO=true;document.body.classList.add('ro');toast('Clé invalide : appli en lecture seule');setSync('ro')}
  const d=await getRemote();
  if(RO){if(d&&d.data){S=Object.assign(DEF(),d.data);T=remoteT=d.t;try{localStorage.setItem('l1view',JSON.stringify(d))}catch(e){}render()}setSync('ro');
   setInterval(async()=>{try{const x=await getRemote();if(x&&x.t!==remoteT){S=Object.assign(DEF(),x.data);T=remoteT=x.t;try{localStorage.setItem('l1view',JSON.stringify(x))}catch(e){}render()}}catch(e){}},60000);return}
  if(d&&d.data){const R=d.data,sR=score(R),sL=score(S);remoteT=d.t;

 k.forEach(d=>{cur=prev&&addD(prev,1)===d?cur+1:1;best=Math.max(best,cur);prev=d});return best}

 const wk=minsRange(wStart(t),t,s.id)/60,ratio=s.goal?wk/s.goal:1;
 let sc=(lr==null?8:lr)+(ex!=null&&ex>=0&&ex<35?(35-ex)*.35:0)+(1-Math.min(ratio,1))*4;
 let why=lr==null?'Pas encore révisé':lr===0?'Révisé aujourd’hui':'Dernière révision il y a '+lr+' j';
 if(ex!=null&&ex>=0&&ex<=21)why+=' · partiel J-'+ex;

function avgSubj(id){const g=S.grades.filter(x=>x.subj===id&&!x.planned);const w=g.reduce((a,x)=>a+(+x.w||1),0);return w?g.reduce((a,x)=>a+x.val/x.max*20*(+x.w||1),0)/w:null}

const INT={normal:.75,intense:1,partiels:1.3};
const hhmm=m=>String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
const isEval=k=>/CC|Partiel|Exam/i.test(k||'');
function examsFor(id){const s=sub(id),d=[];if(s.exam)d.push({date:s.exam,w:1,l:'Partiel'});S.slots.forEach(x=>{if(x.subj===id&&isEval(x.kind))d.push({date:x.date,w:/Partiel|Exam/i.test(x.kind)?1:.6,l:x.kind.split(' ')[0]})});return d}
function freeWin(date){const P=S.plan;let st=tm(P.from||'08:00'),en=tm(P.to||'21:00');
 if(date===today())st=Math.max(st,Math.ceil((nowMin()+5)/15)*15);
 const busy=S.slots.filter(s=>s.date===date).map(s=>[tm(s.start)-15,tm(s.end)+15]);if(P.lunch)busy.push([720,780]);busy.sort((a,b)=>a[0]-b[0]);
 const w=[];let c=st;busy.forEach(([a,b])=>{if(a>c)w.push([c,Math.min(a,en)]);c=Math.max(c,b)});if(c<en)w.push([c,en]);return w.filter(x=>x[1]-x[0]>=20)}
const freeMin=d=>freeWin(d).reduce((a,w)=>a+w[1]-w[0],0);
let PLAN={};
function buildPlan(){const t=today(),k=INT[S.plan.int]||1,days=[],T2={};for(let i=0;i<14;i++){const d=addD(t,i);days.push(d);T2[d]={}}
 const mxc=Math.max(1,...S.subjects.map(x=>+x.coef||1));
 const add=(d,subj,min,why,pr,after)=>{if(!T2[d]||!S.subjects.some(s=>s.id===subj))return;const o=T2[d][subj]=T2[d][subj]||{subj,min:0,why:[],pr:0,after:0};o.min+=min;if(!o.why.includes(why))o.why.push(why);o.pr=Math.max(o.pr,pr);if(after)o.after=Math.max(o.after,after)};
 /* répétition espacée par matière : J0, J+1, J+3 ; le cours suivant fait office de J+7 */
 S.slots.forEach(c=>{if(isEval(c.kind))return;const lab=c.kind.split(' ')[0]+' du '+DL[dow(c.date)];
  [[0,15,'J0',2],[1,30,'J+1',3],[3,25,'J+3',1]].forEach(([o,m,l,p])=>add(addD(c.date,o),c.subj,Math.round(m*k/5)*5,l+' · '+lab,p,o?0:tm(c.end)+15))});
 /* mode partiels permanent : montée en charge sur 21 jours, pondérée par le coefficient */
 S.subjects.forEach(s=>examsFor(s.id).forEach(e=>days.forEach(d=>{const n=diff(d,e.date);if(n>0&&n<=21){const m=Math.round(60*k*e.w*(.6+.4*(+s.coef||1)/mxc)*(1-(n-1)/21)/5)*5;if(m>=10)add(d,s.id,m,e.l+' J-'+n,4+(21-n)/5)}})));
 /* objectif hebdo par matière : on complète dans les jours les plus libres */
 [...new Set(days.map(wStart))].forEach(w=>{const wd=days.filter(d=>wStart(d)===w);S.subjects.forEach(s=>{const done=minsRange(w,addD(t,-1),s.id);let def=(+s.goal||0)*60*k-done-wd.reduce((a,d)=>a+(T2[d][s.id]?T2[d][s.id].min:0),0);
  const cand=wd.filter(d=>!T2[d][s.id]).sort((a,b)=>freeMin(b)-freeMin(a));
  for(const d of cand){if(def<20)break;const m=Math.min(45,Math.round(def/5)*5);add(d,s.id,m,'Objectif hebdo',.5);def-=m}})});
 const out={};
 days.forEach(d=>{const cap=dow(d)>=5?+S.plan.we:+S.plan.cap;let used=0;const wins=freeWin(d),bl=[];
  Object.values(T2[d]).sort((a,b)=>b.pr-a.pr).forEach(x=>{const key=d+'|'+x.subj;if(S.planSkip[key])return;
   let need=Math.min(x.min,90);const dn=d===t?S.sessions.filter(s=>s.date===t&&s.subj===x.subj).reduce((a,s)=>a+s.min,0):0;
   if(S.planDone[key]||dn>=need){bl.push({date:d,subj:x.subj,start:-1,min:need,why:x.why,key,done:1});return}need-=dn;
   for(const w of wins){if(need<15||used>=cap)break;const s0=Math.max(w[0],x.after);const len=Math.floor(Math.min(need,w[1]-s0,cap-used)/5)*5;if(len<15)continue;
    bl.push({date:d,subj:x.subj,start:s0,min:len,why:x.why,key});w[0]=s0+len+10;need-=len;used+=len}});
  bl.sort((a,b)=>a.start-b.start);out[d]=bl});
 PLAN=out}
const findBlock=(key,st)=>(PLAN[key.split('|')[0]]||[]).find(b=>b.key===key&&b.start===+st);
function revH(b){const s=sub(b.subj);return `<button class="slot rev${b.done?' done':''}" data-rv="${b.key}" data-st="${b.start}" style="--c:${s.color}"><div class="t">${b.done?'✓':hhmm(b.start)}<small>${b.done?'fait':b.min+' min'}</small></div><div class="ln"></div><div class="bx"><h3>Révision ${esc(s.short)}</h3><div class="small muted">${esc(b.why.slice(0,3).join(' · '))}</div></div></button>`}

sleep:()=>form('Ajouter une nuit',[{k:'date',l:'Nuit du',t:'date',d:addD(today(),-1)},{k:'bed',l:'Coucher',t:'time',d:'23:00'},{k:'wake',l:'Lever',t:'time',d:'07:00'}],null,o=>{let m=tm(o.wake)-tm(o.bed);if(m<=0)m+=1440;S.sleep=S.sleep.filter(s=>s.date!==o.date);S.sleep.push({date:o.date,h:m/60})}),
subject:(x)=>form(x?'Modifier la matière':'Nouvelle matière',[{k:'name',l:'Nom complet',r:1},{k:'short',l:'Nom court',r:1},{k:'color',l:'Couleur',t:'select',o:Object.entries(PAL).map(([n,c])=>[c,n])},{k:'coef',l:'Coefficient (ECTS)',t:'number',d:1},{k:'goal',l:'Objectif de révision (h / semaine)',t:'number',d:3},{k:'exam',l:'Date du partiel',t:'date'}],x,o=>{if(x)Object.assign(x,o);else S.subjects.push({id:uid(),...o})},x&&S.subjects.length>1?()=>{S.subjects=S.subjects.filter(s=>s!==x);S.slots=S.slots.filter(s=>s.subj!==x.id)}:null),
goals:()=>form('Objectifs',[{k:'dailyGoal',l:'Révision par jour (minutes)',t:'number'},{k:'sportGoal',l:'Séances de sport par semaine',t:'number'},{k:'target',l:'Moyenne visée (/20)',t:'number'}],S,o=>{S.dailyGoal=Math.max(10,o.dailyGoal);S.sportGoal=Math.max(1,o.sportGoal);S.target=o.target}),
import:()=>form('Importer une sauvegarde',[{k:'j',l:'Colle ici le texte copié avec « Copier ma sauvegarde »',t:'area',r:1}],null,o=>{try{restore(o.j)}catch(e){setTimeout(()=>toast('Ce texte n’est pas une sauvegarde valide'),50)}}),
rout:(k)=>form(k==='am'?'Routine du matin':'Routine du soir',[{k:'items',l:'Une habitude par ligne',t:'area'}],{items:S.routine[k].join('\n')},o=>{S.routine[k]=o.items.split('\n').map(s=>s.trim()).filter(Boolean);delete S.routine.done[today()]})
};

document.addEventListener('click',e=>{const b=e.target.closest('button,[data-edtask],[data-edsport],[data-rv]');if(!b)return;const d=b.dataset;
 if(RO&&!('close' in d)&&!['tab','go','day','wk','rv','fs','pre'].some(k=>k in d))return;
 if(d.copy){const u=d.copy==='v'?baseURL()+'#vue':baseURL()+'#edit-'+KEY;navigator.clipboard.writeText(u).then(()=>toast(d.copy==='v'?'Lien spectateur copié':'Ton lien d’édition est copié : garde-le pour toi'),()=>toast('Copie impossible : '+u));return}
 if(d.newkey!==undefined){if(!confirm('Changer ta clé ? Ton ancien lien d’édition ne marchera plus sur aucun appareil.'))return;const k=newKey();rpc('changer_cle',{p_cle:KEY,p_nouvelle:k}).then(()=>{KEY=k;try{localStorage.setItem('l1key',k)}catch(e){}render();toast('Nouvelle clé active : recopie ton lien d’édition')}).catch(()=>toast('Impossible de changer la clé (hors ligne ?)'));return}
 if('close' in d||(e.target.dataset&&'close' in e.target.dataset))return close();
 if('del' in d){FS.onDel();close();save();render();return}
 if(d.tab){tab=d.tab;pg=null;render();scrollTo(0,0);return}
 if(d.go!==undefined){tab='more';pg=d.go||null;render();scrollTo(0,0);return}
 if(d.day){day=+d.day;render();return}
 if(d.wk){wk=d.wk==='0'?wStart(today()):addD(wk,7*+d.wk);day=d.wk==='0'?dow(today()):0;render();return}
 if(d.slot)return ADD.slot(S.slots.find(s=>s.id===d.slot));
 if(d.bklist!==undefined)return openBk();
 if(d.bkr)return restore(BK[+d.bkr].json);
 if(d.rvgo)return startRev(findBlock(d.rvgo,d.st));
 if(d.rv)return openRev(findBlock(d.rv,d.st));
 if(d.rvdone){const b=findBlock(d.rvdone,d.st);if(b&&b.date===today())logSes(b.min,b.subj);S.planDone[d.rvdone]=true;close();toast('Bloc validé : +15 XP');save();render();return}
 if(d.rvundo){delete S.planDone[d.rvundo];close();save();render();return}
 if(d.rvskip){S.planSkip[d.rvskip]=true;close();save();render();return}
 if(d.add)return ADD[d.add]();
 if(d.edtask)return ADD.task(S.tasks.find(s=>s.id===d.edtask));
 if(d.edsport)return ADD.sport(S.sport.find(s=>s.id===d.edsport));
 if(d.edgrade)return ADD.grade(S.grades.find(s=>s.id===d.edgrade));
 if(d.ederr)return ADD.error(S.errors.find(s=>s.id===d.ederr));
 if(d.edsub)return ADD.subject(S.subjects.find(s=>s.id===d.edsub));
 if(d.edrout)return ADD.rout(d.edrout);
 if(d.p3!==undefined){const t=today(),p=S.prio[t],n=+d.p3;p.done=p.done.includes(n)?p.done.filter(x=>x!==n):p.done.concat(n);if(p3ok(p))toast('Priorités du jour bouclées : +30 XP')}
 else if(d.defi!==undefined){S.defi[today()]=true;toast('Défi relevé : +25 XP')}
 else if(d.tk){const x=S.tasks.find(s=>s.id===d.tk);x.done=!x.done;if(x.done)x.doneAt=today()}
 else if(d.val!==undefined){S.val[today()]=true;toast('Journée validée — série : '+streak()+' j')}
 else if(d.unval!==undefined){delete S.val[today()]}
 else if(d.rev){fsub=d.rev;tab='focus';scrollTo(0,0)}
 else if(d.fs){fsub=d.fs}
 else if(d.pre){pre=+d.pre;render();return}
 else if(d.start!==undefined){const p=PRE[pre];TM={mode:'focus',subj:fsub,dur:p[0]*60,brk:p[1],end:Date.now()+p[0]*60000,started:Date.now()};saveTM();render();return}
 else if(d.pause!==undefined){if(TM.end){TM.left=remain();TM.end=null}else TM.end=Date.now()+TM.left*1000;saveTM();render();return}
 else if(d.stop!==undefined){if(TM.mode==='focus'){const m=(TM.dur-remain())/60;logSes(m,TM.subj);if(m>=1)toast(fm(m)+' ajoutées en '+sub(TM.subj).short)}TM=null;saveTM();render();return}
 else if(d.delses){S.sessions=S.sessions.filter(s=>s.id!==d.delses)}
 else if(d.ok){const x=S.errors.find(s=>s.id===d.ok),st=[1,3,7,14,30];x.step=Math.min(4,(x.step||0)+1);S.xpErr=(S.xpErr||0)+1;x.next=addD(today(),st[x.step]);if(x.step===4&&x.mastered){S.errors=S.errors.filter(s=>s!==x);S.errDone=(S.errDone||0)+1;toast('Erreur maîtrisée, retirée du carnet')}else if(x.step===4)x.mastered=true}
 else if(d.ko){const x=S.errors.find(s=>s.id===d.ko);x.step=0;x.mastered=false;x.next=addD(today(),1)}
 else if(d.rt){const[k,i]=d.rt.split(':'),t=today();const r=S.routine.done[t]=S.routine.done[t]||{am:[],pm:[]};const n=+i;r[k]=r[k].includes(n)?r[k].filter(x=>x!==n):r[k].concat(n)}
 else if(d.export!==undefined){navigator.clipboard.writeText(JSON.stringify(S)).then(()=>toast('Sauvegarde copiée'),()=>toast('Copie impossible ici'));return}
 else return;
 save();render()});
document.addEventListener('input',e=>{const r=e.target.closest&&e.target.closest('[data-sim]');if(!r)return;S.sim[r.dataset.sim]=+r.value;const l=$('#sv-'+r.dataset.sim);if(l)l.textContent=(+r.value).toFixed(1);const z=$('#simres');if(z)z.innerHTML=simRes()});
document.addEventListener('change',e=>{if(e.target.closest&&e.target.closest('[data-sim]'))save()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#sheet').hidden)close()});
render();
}
</script>
</body>
</html>
